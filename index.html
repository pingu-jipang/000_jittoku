<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ジットク - 電卓では面倒、Excelでは大げさな日常の計算をすぐ終わらせる無料Webツール集">
  <title>ジットク｜ちょっとした計算を、すぐ終わらせる。</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="wrap topbar">
      <a class="logo" href="#top">ジットク</a>
      <span>電卓はめんどう、Excelはおおげさ。</span>
    </div>
  </header>

  <main id="top" class="wrap">
    <section class="intro">
      <h1>ちょっとした計算を、<br>すぐ終わらせる。</h1>
      <p>知りたいことを入れるだけ。計算式は考えなくていい。</p>
    </section>

    <section class="tools" aria-labelledby="tools-title">
      <h2 id="tools-title">ツール</h2>
      <div class="tool-list">
        <div class="tool-row disabled"><strong>かんたん割り勘</strong><span>準備中</span></div>
        <a class="tool-row" href="#recipe"><strong>レシピ倍率変換</strong><span>使う →</span></a>
        <div class="tool-row disabled"><strong>時給換算</strong><span>準備中</span></div>
        <div class="tool-row disabled"><strong>今月もつ？</strong><span>準備中</span></div>
        <div class="tool-row disabled"><strong>何日働けば買える？</strong><span>準備中</span></div>
      </div>
    </section>

    <section id="recipe" class="calculator">
      <div class="section-title">
        <h2>レシピ倍率変換</h2>
        <p>元の人数と作りたい人数、材料を入力してください。</p>
      </div>

      <form id="recipe-form">
        <div class="servings">
          <label>
            <span>元のレシピ</span>
            <div class="unit-input"><input id="original-servings" type="number" min="0.1" step="0.1" value="4" required><span>人前</span></div>
          </label>
          <span class="to">→</span>
          <label>
            <span>作りたい量</span>
            <div class="unit-input"><input id="target-servings" type="number" min="0.1" step="0.1" value="2" required><span>人前</span></div>
          </label>
        </div>

        <div class="ingredients-title">
          <strong>材料</strong>
          <button id="add-row" class="link-button" type="button">＋ 追加</button>
        </div>
        <div id="ingredient-list" class="ingredient-list"></div>
        <p class="hint">数量は 300 / 0.5 / 1/2 のように入力できます。</p>
        <button class="submit" type="submit">変換する</button>
      </form>

      <section id="result" class="result" hidden aria-live="polite">
        <h3 id="result-title"></h3>
        <div id="result-list"></div>
        <div class="result-actions">
          <button id="copy-result" class="copy" type="button">コピー</button>
          <span id="copy-status" aria-live="polite"></span>
        </div>
      </section>
    </section>
  </main>

  <footer><div class="wrap">ジットク</div></footer>
  <script src="app.js" defer></script>
</body>
</html>
