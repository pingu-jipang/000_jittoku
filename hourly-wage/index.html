<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="月の手取り額、1日の労働時間、勤務日数から実質時給を計算。月給を「実際に1時間働いて手元に残る金額」に換算できます。">
  <meta name="robots" content="index,follow">
  <title>手取りから実質時給を計算｜ジットク</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><div class="wrap topbar"><a class="logo" href="../">ジットク</a><span>電卓はめんどう、Excelはおおげさ。</span></div></header>
  <main class="wrap tool-page">
    <a class="back-link" href="../">← ツール一覧</a>
    <section class="tools" aria-labelledby="tools-title">
      <h2 id="tools-title">ツール</h2>
      <label class="tool-search"><span class="sr-only">ツールを検索</span><input id="tool-search" type="search" placeholder="ツールを検索（例：レシピ）" autocomplete="off"></label>
      <div class="tool-list"><a class="tool-row" href="../warikan/" data-search="かんたん割り勘 精算 飲み会 立替 1次会 2次会 参加者"><strong>かんたん割り勘</strong><span>使う →</span></a>
        <a class="tool-row" href="../recipe/" data-search="レシピ倍率変換 料理 人数 食材 分量 何人前"><strong>レシピ倍率変換</strong><span>使う →</span></a>
        <a class="tool-row" href="../unit-price/" data-search="単価比較 単位あたり 100g 1L グラム ミリリットル kg 安い 値段"><strong>単価比較</strong><span>使う →</span></a>
        <a class="tool-row current" href="../hourly-wage/" data-search="時給換算 給料 月給 手取り 労働時間 実質時給"><strong>時給換算</strong><span>表示中</span></a>
        <a class="tool-row" href="../cashflow/" data-search="今月お金足りる お金 足りる 今月もつ 口座 残高 家計 給料 カード 家賃 支払い"><strong>今月お金足りる？</strong><span>使う →</span></a>
        <a class="tool-row" href="../work-to-buy/" data-search="何日働けば買える 価格 時給 労働 欲しいもの 買える"><strong>何日働けば買える？</strong><span>使う →</span></a>
        <a class="tool-row" href="../character-count/" data-search="文字数カウント 文字数 文字 カウント テキスト 文章"><strong>文字数カウント</strong><span>使う →</span></a></div>
      <p id="tool-search-empty" class="tool-search-empty" hidden>該当するツールはありません。</p>
    </section>
    
    <section class="calculator">
      <div class="section-title"><h1>時給換算</h1><p>月の手取り額と実際の労働時間から、手元に残る金額ベースの実質時給を計算します。</p></div>
      <form id="hourly-wage-form">
        <div class="field-grid two-col">
          <label><span>対象月</span><input id="wage-month" class="text-input" type="month" required></label>
          <label><span>1日の労働時間</span><div class="unit-input"><input id="wage-daily-hours" type="number" min="0.1" step="0.1" inputmode="decimal" value="8" required><span>時間</span></div></label>
          <label><span>勤務日数</span><div class="unit-input"><input id="wage-workdays" type="number" min="1" step="1" inputmode="numeric" required><span>日</span></div></label>
          <label><span>手取り額</span><div class="unit-input"><input id="wage-takehome" type="number" min="1" step="1" inputmode="numeric" value="250000" required><span>円</span></div></label>
        </div>
        <p class="hint">勤務日数は対象月の月〜金の日数を初期値にしています。実態に合わせて変更できます。</p>
        <button class="submit" type="submit">計算する</button>
      </form>
      <section id="hourly-wage-result" class="result" hidden aria-live="polite"><h3>あなたの実質時給は</h3><p id="hourly-wage-answer" class="answer-big"></p><p id="hourly-wage-detail" class="answer-detail"></p></section>
    </section>
  </main>
  <footer><div class="wrap">ジットク</div></footer>
  <script src="../app.js" defer></script>
</body>
</html>
