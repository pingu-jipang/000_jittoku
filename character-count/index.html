<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="文章の文字数をすぐにカウント。空白・改行を含む文字数、除いた文字数、行数を無料で確認できます。">
  <meta name="robots" content="index,follow">
  <title>文字数カウント・行数確認｜ジットク</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header><div class="wrap topbar"><a class="logo" href="../">ジットク</a><span>電卓はめんどう、Excelはおおげさ。</span></div></header>
  <main class="wrap tool-page">
    <a class="back-link" href="../">← ツール一覧</a>
    <section class="tools" aria-labelledby="tools-title">
      <h2 id="tools-title">ツール</h2>
      <label class="tool-search"><span class="sr-only">ツールを検索</span><input id="tool-search" type="search" placeholder="ツールを検索（例：レシピ）" autocomplete="off"></label>
      <div class="tool-list"><a class="tool-row" href="../warikan/" data-search="かんたん割り勘 精算 飲み会 立替 1次会 2次会 参加者"><strong>かんたん割り勘</strong><span>使う →</span></a>
        <a class="tool-row" href="../recipe/" data-search="レシピ倍率変換 料理 人数 食材 分量 何人前"><strong>レシピ倍率変換</strong><span>使う →</span></a>
        <a class="tool-row" href="../unit-price/" data-search="単価比較 単位あたり 100g 1L グラム ミリリットル kg 安い 値段"><strong>単価比較</strong><span>使う →</span></a>
        <a class="tool-row" href="../hourly-wage/" data-search="時給換算 給料 月給 手取り 労働時間 実質時給"><strong>時給換算</strong><span>使う →</span></a>
        <a class="tool-row" href="../cashflow/" data-search="今月お金足りる お金 足りる 今月もつ 口座 残高 家計 給料 カード 家賃 支払い"><strong>今月お金足りる？</strong><span>使う →</span></a>
        <a class="tool-row" href="../work-to-buy/" data-search="何日働けば買える 価格 時給 労働 欲しいもの 買える"><strong>何日働けば買える？</strong><span>使う →</span></a>
        <a class="tool-row current" href="../character-count/" data-search="文字数カウント 文字数 文字 カウント テキスト 文章"><strong>文字数カウント</strong><span>表示中</span></a></div>
      <p id="tool-search-empty" class="tool-search-empty" hidden>該当するツールはありません。</p>
    </section>
    
    <section class="calculator">
      <div class="section-title"><h1>文字数カウント</h1></div>
      <label for="count-text"><span>文章を入力</span></label>
      <textarea id="count-text" class="counter-input" rows="9" placeholder="ここに文章を入力・貼り付け"></textarea>
      <section class="result" aria-live="polite" aria-label="カウント結果">
        <div class="counter-summary">
          <div class="counter-stat"><span>文字数</span><strong id="count-all">0</strong></div>
          <div class="counter-stat"><span>空白・改行を除く</span><strong id="count-no-space">0</strong></div>
          <div class="counter-stat"><span>行数</span><strong id="count-lines">0</strong></div>
        </div>
      </section>
    </section>
  </main>
  <footer><div class="wrap">ジットク</div></footer>
  <script src="../app.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
